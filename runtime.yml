---
# Runtime Environment Setup (Docker, Kubernetes, Helm)
- name: Apt cache update
  block:
    - name: Update apt cache
      apt:
        update_cache: true
    - name: Install base packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
    - name: Debug - APT cache updated
      debug:
        msg: "✅ APT cache updated and base packages installed"

- name: Stop unattended-upgrades
  systemd:
    name: unattended-upgrades
    state: stopped
    enabled: no

# Install Docker
- block:
    - name: Add Docker GPG key
      shell: |
        set -o pipefail
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor --yes -o /usr/share/keyrings/docker-archive-keyring.gpg
      args:
        executable: /bin/bash
        creates: /usr/share/keyrings/docker-archive-keyring.gpg

    - name: Add Docker repository
      shell: |
        set -o pipefail
        arch=$(dpkg --print-architecture)
        codename=$(lsb_release -cs)
        echo "deb [arch=${arch} signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu ${codename} stable" \
          | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        executable: /bin/bash
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install Docker engine
      apt:
        name:
          - "docker-ce={{ docker_version }}"
          - "docker-ce-cli={{ docker_cli_version }}"
          - "containerd.io={{ containerd_version }}"
          - "docker-compose-plugin={{ compose_plugin_version }}"
        state: present

    - name: Hold Docker packages
      apt:
        name: "{{ item }}"
        state: present
        dpkg_options: 'hold'
      loop:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-compose-plugin

    - name: Add user to Docker group
      user:
        name: "{{ user_name }}"
        groups: docker
        append: true

    - name: Debug - Docker setup completed
      debug:
        msg: |
          ✅ Docker setup completed successfully:
          - GPG key added
          - repo configured
          - engine & plugins installed
          - packages held
          - user {{ user_name }} added to Docker group

# Configure prerequisites for Kubernetes runtime (containerd, ACL, sysctl, swap, modules)"
- block:
    - name: Install ACL and set permissions
      apt:
        name: acl
        state: present

    - name: Set ACL for containerd socket
      command: setfacl -m u:{{ user_name }}:rw /run/containerd/containerd.sock
      register: setfacl_result
      changed_when: setfacl_result.rc == 0
      failed_when: setfacl_result.rc not in [0, 1]  # Accept exit code 0 (success) or 1 (some acceptable failure)
      when: not ansible_check_mode

    - name: Disable swap
      shell: |
        swapoff -a
        sed -i -E 's|^([^#].*\s+swap\s+.*)$|#\1|' /etc/fstab
      register: disable_swap_result
      changed_when: disable_swap_result.rc == 0

    - name: Check if kernel modules config exists
      stat:
        path: /etc/modules-load.d/k8s.conf
      register: k8s_conf_stat

    - name: Create kernel modules config for K8s
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'
      when: not k8s_conf_stat.stat.exists

    - name: Load required kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Set sysctl params for K8s
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: '0644'

    - name: Apply sysctl params
      command: sysctl --system
      changed_when: true

    - name: Generate default containerd config
      shell: containerd config default > /etc/containerd/config.toml
      args:
        executable: /bin/bash
      become: true
      changed_when: true

    - name: Enable SystemdCgroup in containerd config
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      become: true

    - name: Restart containerd after config
      systemd:
        name: containerd
        state: restarted

    - name: Debug - Prerequisites configured
      debug:
        msg: "✅ Kubernetes prerequisites configured: ACL set, swap disabled, kernel modules loaded, sysctl applied, and containerd configured"

# Installing and initialize Kubeadm
- block:
    - name: Install Kubeadm dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present

    - name: Add Kubernetes GPG key safely
      shell: |
        set -o pipefail
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        executable: /bin/bash

    - name: Add Kubernetes APT repo
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /"
        mode: '0644'

    - name: Install Kubernetes packages
      apt:
        update_cache: true
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes packages
      apt:
        name: "{{ item }}"
        state: present
        dpkg_options: 'hold'
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet
      systemd:
        name: kubelet
        enabled: true
        state: started

    - name: Initialize Kubernetes (master only)
      command: kubeadm init --pod-network-cidr=192.168.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init_result

    - name: Set up kubeconfig for user
      shell: |
        mkdir -p /home/{{ user_name }}/.kube
        cp -i /etc/kubernetes/admin.conf /home/{{ user_name }}/.kube/config
        chown {{ user_name }}:{{ user_name }} /home/{{ user_name }}/.kube/config
      args:
        creates: /home/{{ user_name }}/.kube/config

    - name: Summary - Kubernetes master node setup
      debug:
        msg: |
          ✅ Kubernetes master setup complete:
          - Dependencies installed
          - GPG key and repo added
          - kubelet, kubeadm, kubectl installed and held
          - kubelet enabled
          - Cluster initialized (kubeadm)
          - kubeconfig configured for {{ user_name }}

# Installation of CNI and Helm
- block:
    - name: Check if Calico operator is installed
      command: kubectl get deployment tigera-operator -n tigera-operator --kubeconfig /etc/kubernetes/admin.conf
      register: calico_check
      failed_when: false
      changed_when: false

    - name: Install Calico tigera-operator manifest
      command:
        argv:
          - kubectl
          - create
          - -f
          - https://raw.githubusercontent.com/projectcalico/calico/v3.30.0/manifests/tigera-operator.yaml
          - --kubeconfig
          - /etc/kubernetes/admin.conf
      when: calico_check.rc != 0
      register: install_operator
      changed_when: install_operator.rc == 0

    - name: Wait before applying Calico custom resources (allow operator to initialize)
      pause:
        seconds: 60
      when: calico_check.rc != 0

    - name: Install Calico custom resources manifest
      command:
        argv:
          - kubectl
          - create
          - -f
          - https://raw.githubusercontent.com/projectcalico/calico/v3.30.0/manifests/custom-resources.yaml
          - --kubeconfig
          - /etc/kubernetes/admin.conf
      when: calico_check.rc != 0
      register: install_custom_resources
      changed_when: install_custom_resources.rc == 0
      retries: 3
      delay: 30
      until: install_custom_resources.rc == 0

    - name: Remove control-plane taint from nodes
      command: kubectl taint nodes --all node-role.kubernetes.io/control-plane- --kubeconfig /etc/kubernetes/admin.conf
      register: taint_remove
      changed_when: "'removed' in taint_remove.stdout or taint_remove.rc == 0"
      failed_when: false

    - name: Install Helm
      snap:
        name: helm
        channel: 3.7/stable
        classic: true
        state: present

    - name: Debug - Installation of CNI and Helm
      debug:
        msg: "✅ CNI and Helm Installed"

# 📦 Configure local Docker registry and trust Kubernetes CA
- block:
    - name: Add Docker registry to /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 meep-docker-registry"
        state: present

    - name: Trust Kubernetes CA
      copy:
        src: /etc/kubernetes/pki/ca.crt
        dest: /usr/local/share/ca-certificates/kubernetes-ca.crt
        mode: '0644'

    - name: Update trusted certificates
      command: update-ca-certificates
      changed_when: true

    - name: Restart Docker and containerd
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - docker
        - containerd

    - name: Debug - 📦 local Docker registry and trust Kubernetes CA
      debug:
        msg: "✅ Local Docker registry added, CA trusted, certificates updated, and Docker/containerd restarted"

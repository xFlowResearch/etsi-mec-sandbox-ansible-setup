---

- name: Install required system packages
  apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  with_items:
    - build-essential
    - libssl-dev

- name: Check if nvm is installed
  stat:
    path: "{{ target_home }}/.nvm/nvm.sh"
  register: nvm_installed

- name: Download nvm install script
  get_url:
    url: https://raw.githubusercontent.com/creationix/nvm/v0.34.0/install.sh
    dest: "{{ target_home }}/install_nvm.sh"
    mode: '0755'
  when: not nvm_installed.stat.exists

- name: Install nvm
  become: true
  become_user: "{{ target_user }}"
  shell: "bash {{ target_home }}/install_nvm.sh"
  args:
    executable: /bin/bash
    creates: "{{ target_home }}/.nvm/nvm.sh"

- name: Install node
  become: true
  become_user: "{{ target_user }}"
  shell: /bin/bash -c "source {{ target_home }}/.nvm/nvm.sh && nvm install {{ node_version }}"
  args:
    executable: /bin/bash
    creates: "{{ target_home }}/.nvm/versions/node/v{{ node_version }}"

- name: Install npm and eslint
  become: false
  shell: >
    source {{ target_home }}/.nvm/nvm.sh &&
    npm install -g npm@{{ npm_version }} &&
    npm install -g eslint@{{ eslint_version }} &&
    npm install -g eslint-plugin-react
  args:
    executable: /bin/bash
    creates: "/home/{{ target_user }}/.nvm/versions/node/v{{ node_version }}/lib/node_modules/eslint"

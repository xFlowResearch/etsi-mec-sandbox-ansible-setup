---
# Development Environment Setup (Go, Node.js, Python)
- name: Check Go version
  command: /usr/local/go/bin/go version
  register: go_version_output
  ignore_errors: true
  changed_when: false

- name: Install Go toolchain
  unarchive:
    src: "{{ go_url }}"
    dest: /usr/local
    remote_src: true
  when: go_version_output.stdout is not search("go{{ go_version }}")

- name: Setup Go environment
  blockinfile:
    path: "/home/{{ user_name }}/.bashrc"
    block: |
      export GOPATH=/home/{{ user_name }}/gocode
      export PATH=$PATH:$GOPATH/bin:/usr/local/go/bin

- name: Required packages are installed for NVM/Node
  apt:
    name:
      - build-essential
      - libssl-dev
    state: present
    update_cache: true

- name: Check if nvm is installed
  stat:
    path: "/home/{{ user_name }}/.nvm/nvm.sh"
  register: nvm_installed

- name: Download nvm install script
  get_url:
    url: https://raw.githubusercontent.com/creationix/nvm/v0.34.0/install.sh
    dest: "/home/{{ user_name }}/install_nvm.sh"
    mode: '0755'
  when: not nvm_installed.stat.exists

- name: Run NVM install script
  command: bash /home/{{ user_name }}/install_nvm.sh
  args:
    executable: /bin/bash
  become_user: "{{ user_name }}"
  become: true
  register: nvm_result
- debug:
    var: nvm_result.stdout_lines

- name: Install Node.js 12.19.0, update npm, and install eslint packages
  shell: bash -ilc 'nvm install 12.19.0 && npm install -g npm@6.14.8 && npm install -g eslint@5.16.0 && npm install -g eslint-plugin-react'
  become: true
  become_user: "{{ user_name }}"
  args:
    executable: /bin/bash
  environment:
    NVM_DIR: "/home/{{ user_name }}/.nvm"

- name: Install GolangCI-Lint
  shell: |
    /usr/local/go/bin/go env -w GOPATH=/home/{{ user_name }}/gocode
    curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /home/{{ user_name }}/gocode/bin v1.46.0
  args:
    executable: /bin/bash
    creates: /home/{{ user_name }}/gocode/bin/golangci-lint
  environment:
    PATH: "/usr/local/go/bin:/home/{{ user_name }}/gocode/bin:{{ ansible_env.PATH }}"
  become: true
  become_user: "{{ user_name }}"

- name: Install Python packages
  pip:
    name: "{{ item }}"
  loop: "{{ pip_packages }}"

